server:
  port: 8101

spring:
  application:
    name: park-energy-access
  datasource:
    url: ${PARK_DB_URL:jdbc:mysql://localhost:3306/park_energy_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

park:
  mqtt:
    inbound-enabled: true
    host: localhost
    port: 1883
    username: access-service
    password: access-secret
    client-id: park-energy-access
    qos: 1
    command-timeout-seconds: 30
  rabbitmq:
    exchange: park.energy.exchange
    raw-data-queue: raw_electric_data
    raw-data-routing-key: data.raw
